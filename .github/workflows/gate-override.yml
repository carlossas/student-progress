name: gate-override

# AGENTS#14: a production-level approver comments `/gate-override <reason>` on a blocked PR.
# Runs from the default branch (trusted code); authorization is checked in gate/report/override.py.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  override:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/gate-override') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply override
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_ORG_TOKEN: ${{ secrets.GATE_ORG_TOKEN }}
          GATE_OVERRIDE_TEAM: ${{ vars.GATE_OVERRIDE_TEAM }}
          GATE_OVERRIDE_PERMISSIONS: ${{ vars.GATE_OVERRIDE_PERMISSIONS || 'admin,maintain' }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s' "$COMMENT_BODY" > "$RUNNER_TEMP/comment.txt"
          python -m gate override --pr "$PR_NUMBER" --user "$COMMENTER" --body-file "$RUNNER_TEMP/comment.txt"
